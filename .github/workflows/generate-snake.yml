name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate purple snake (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RiyaSood23
          outputs: |
            dist/github-snake-light.svg?color_snake=#a855f7&color_dots=#ede9fe,#ddd6fe,#c4b5fd,#a78bfa
            dist/github-snake-dark.svg?color_snake=#c084fc&color_dots=#0f172a,#1e1b4b,#312e81,#7c3aed

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
